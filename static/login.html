<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TI AUTOPILOT | Algorithmic Trading Authentication</title>

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="/static/favicon.png" />
  <link rel="shortcut icon" href="/static/favicon.ico" />

  <!-- Google Fonts: Inter & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap"
    rel="stylesheet">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
          },
          colors: {
            brand: {
              navy: '#152244',
              orange: '#E8924A',
              orangeHover: '#D97E33'
            }
          }
        }
      }
    }
  </script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- Supabase Client Library CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body {
      background-color: #F8FAFC;
      background-image: 
        radial-gradient(circle at 50% 25%, rgba(232, 146, 74, 0.08) 0%, transparent 55%),
        radial-gradient(circle at 10% 85%, rgba(21, 34, 68, 0.04) 0%, transparent 40%);
    }
  </style>
</head>

<body class="min-h-screen flex flex-col items-center justify-center p-4 antialiased text-slate-800">

  <!-- Centered Auth Card -->
  <div class="w-full max-w-sm bg-white border border-slate-200/80 rounded-2xl p-8 shadow-sm transition-all space-y-6">
    
    <!-- Top Brand Logo & Title -->
    <div class="text-center space-y-3">
      <div class="inline-flex items-center justify-center">
        <div class="w-16 h-16 rounded-2xl bg-white border border-slate-200/90 p-2 shadow-sm flex items-center justify-center">
          <img src="/static/logo.png" alt="TI AUTOPILOT Logo" class="w-full h-full object-contain" />
        </div>
      </div>

      <div>
        <h1 class="text-xl font-bold font-sans tracking-tight text-slate-900">TI AUTOPILOT</h1>
        <p class="text-xs font-sans text-slate-500 mt-1">Algorithmic Trading Platform</p>
      </div>
    </div>

    <!-- Error Alert Banner (Displayed on invalid credentials) -->
    <div id="error-alert" class="hidden p-3 rounded-xl bg-rose-50 border border-rose-200 text-rose-600 text-xs font-mono flex items-start gap-2.5">
      <i data-lucide="alert-circle" class="w-4 h-4 shrink-0 mt-0.5"></i>
      <span id="error-msg">Invalid credentials. Please contact your system administrator.</span>
    </div>

    <!-- Client Login Form -->
    <form id="login-form" onsubmit="handleLogin(event)" class="space-y-4 font-sans text-xs">
      
      <div>
        <label for="email" class="block text-slate-600 mb-1.5 font-medium">Operator Email</label>
        <div class="relative">
          <i data-lucide="mail" class="w-4 h-4 text-slate-400 absolute left-3.5 top-1/2 -translate-y-1/2 pointer-events-none"></i>
          <input 
            type="email" 
            id="email" 
            name="email" 
            placeholder="admin@tiautopilot.internal" 
            value="admin@tiautopilot.internal"
            required 
            class="w-full bg-slate-50 border border-slate-200 rounded-xl pl-10 pr-3 py-2.5 text-slate-900 placeholder-slate-400 focus:outline-none focus:border-orange-500 focus:ring-1 focus:ring-orange-500 transition-colors font-mono"
          />
        </div>
      </div>

      <div>
        <label for="password" class="block text-slate-600 mb-1.5 font-medium">Master Passkey</label>
        <div class="relative">
          <i data-lucide="lock" class="w-4 h-4 text-slate-400 absolute left-3.5 top-1/2 -translate-y-1/2 pointer-events-none"></i>
          <input 
            type="password" 
            id="password" 
            name="password" 
            placeholder="••••••••••••" 
            value="admin"
            required 
            class="w-full bg-slate-50 border border-slate-200 rounded-xl pl-10 pr-3 py-2.5 text-slate-900 placeholder-slate-400 focus:outline-none focus:border-orange-500 focus:ring-1 focus:ring-orange-500 transition-colors font-mono"
          />
        </div>
      </div>

      <button 
        type="submit" 
        id="submit-btn"
        class="w-full py-2.5 rounded-xl font-semibold bg-[#152244] hover:bg-[#1C2C58] text-white shadow-sm transition duration-150 flex items-center justify-center gap-2 mt-2 cursor-pointer"
      >
        <i data-lucide="log-in" class="w-4 h-4"></i>
        <span>Access TI AUTOPILOT Console</span>
      </button>

    </form>

    <!-- Footer Security Notice -->
    <div class="pt-2 border-t border-slate-100 text-center">
      <span class="text-[11px] font-sans text-slate-400 flex items-center justify-center gap-1.5">
        <i data-lucide="shield-check" class="w-3.5 h-3.5 text-emerald-600"></i>
        Local Gateway • HMAC-SHA256 Protected
      </span>
    </div>

  </div>

  <script>
    // Enforce pure light theme
    localStorage.setItem('theme', 'light');
    document.documentElement.classList.remove('dark');
    document.body.classList.remove('dark');

    // --------------------------------------------------------
    // SUPABASE CONFIGURATION
    // --------------------------------------------------------
    const SUPABASE_URL = "YOUR_SUPABASE_PROJECT_URL";
    const SUPABASE_ANON_KEY = "YOUR_SUPABASE_ANON_KEY";

    let supabaseClient = null;
    const isSupabaseConfigured = SUPABASE_URL && !SUPABASE_URL.includes("YOUR_SUPABASE") && SUPABASE_URL.startsWith("https://");

    if (typeof supabase !== 'undefined' && isSupabaseConfigured) {
      try {
        supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
      } catch (err) {
        console.warn("Supabase initialization error:", err);
      }
    }

    // --------------------------------------------------------
    // AUTHENTICATION HANDLER
    // --------------------------------------------------------
    async function handleLogin(e) {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value.trim();
      const errorAlert = document.getElementById('error-alert');
      const errorMsg = document.getElementById('error-msg');
      const submitBtn = document.getElementById('submit-btn');

      errorAlert.classList.add('hidden');
      submitBtn.disabled = true;
      submitBtn.innerHTML = `<span class="animate-spin mr-2">⚙</span> Authenticating...`;

      try {
        let authSuccess = false;
        let sessionData = null;

        if (supabaseClient) {
          const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
          if (error) {
            throw error;
          }
          if (data && data.session) {
            authSuccess = true;
            sessionData = {
              access_token: data.session.access_token,
              user: data.user
            };
          }
        } else {
          // Demo / Internal Bridge Authenticator fallback
          const isValidUser = (
            email === 'admin@tiautopilot.internal' || 
            email === 'admin@executrade.internal' || 
            email === 'admin' || 
            email.includes('@')
          );
          const isValidPass = (password === 'admin' || password.length >= 4);

          if (isValidUser && isValidPass) {
            authSuccess = true;
            const fullEmail = email.includes('@') ? email : `${email}@tiautopilot.internal`;
            sessionData = {
              access_token: 'ext-sess-' + Date.now().toString(36),
              user: {
                email: fullEmail,
                user_metadata: { full_name: 'TI Operator' }
              }
            };
          } else {
            throw new Error('Invalid credentials');
          }
        }

        if (authSuccess && sessionData) {
          localStorage.setItem('executrade_session', JSON.stringify(sessionData));
          window.location.replace('/dashboard');
          return;
        }
      } catch (err) {
        console.warn("Login failed:", err);
        errorMsg.innerText = "Invalid credentials. Please contact your system administrator.";
        errorAlert.classList.remove('hidden');
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerHTML = `<i data-lucide="log-in" class="w-4 h-4"></i><span>Access TI AUTOPILOT Console</span>`;
        lucide.createIcons();
      }
    }

    // --------------------------------------------------------
    // BOOTSTRAP CHECK
    // --------------------------------------------------------
    window.addEventListener('DOMContentLoaded', () => {
      lucide.createIcons();

      const existingSession = localStorage.getItem('executrade_session');
      if (existingSession) {
        try {
          const sess = JSON.parse(existingSession);
          if (sess && sess.user) {
            window.location.replace('/dashboard');
            return;
          }
        } catch(e) {}
      }

      const params = new URLSearchParams(window.location.search);
      if (params.get('error') === 'invalid') {
        document.getElementById('error-alert').classList.remove('hidden');
      }
    });
  </script>
</body>

</html>
